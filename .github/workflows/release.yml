name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go test ./...
      # conventional commit(fix: → patch, feat: → minor, 본문에 "BREAKING CHANGE:" 푸터 → major)일
      # 때만 태그가 생기고, 태그가 없으면 아래 빌드/릴리스 단계는 전부 건너뛴다
      # (docs/chore 푸시는 릴리스 미발생). 주의: 이 액션(angular preset)은 "feat!:"의
      # "!" 표기를 인식하지 못한다 — major 릴리스는 반드시 BREAKING CHANGE 푸터로.
      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
      - name: Build
        if: steps.tag.outputs.new_tag != ''
        env:
          CGO_ENABLED: "1"
        run: go build -trimpath -ldflags "-H windowsgui -s -w -extldflags=-Wl,--subsystem,windows -X main.version=${{ steps.tag.outputs.new_version }}" -o mabinogi-rice-collector.exe .
      - name: Checksum
        if: steps.tag.outputs.new_tag != ''
        shell: pwsh
        run: '"{0}  mabinogi-rice-collector.exe" -f (Get-FileHash mabinogi-rice-collector.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii SHA256SUMS.txt'
      - name: Create release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: |
            mabinogi-rice-collector.exe
            SHA256SUMS.txt
